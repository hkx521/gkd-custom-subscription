name: Auto Sync and Build GKD Subscription

on:
  schedule:
    # 期望每天北京时间早上 04:00 (UTC 20:00) 执行；GitHub 调度队列实测延迟 2~3.5 小时，
    # 历史落点在 UTC 22:20~00:09（北京 06:20~08:00），只影响新鲜度不影响正确性。
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击触发
  push:
    branches:
      - main
    paths:
      - 'config.mjs'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build custom subscription
        run: pnpm run build

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "上游内容未变化，version 保持不变，跳过提交。"
          else
            git commit -m "chore(auto): update subscription $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
