name: Auto Sync and Build GKD Subscription

on:
  schedule:
    # 每天北京时间早上 04:00 (UTC 20:00) 自动执行构建
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击触发
  push:
    branches:
      - main
    paths:
      - 'config.mjs'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build custom subscription
        run: pnpm run build

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update subscription $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
